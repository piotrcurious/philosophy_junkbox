<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeries Lafayette - Psychogeographical Map Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(12, 16, 26, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0;
            color: #00f0ff;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 8px;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #aaa;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #ccc;
        }

        select, input[type=range] {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            padding: 6px;
            box-sizing: border-box;
            outline: none;
        }

        input[type=range] {
            -webkit-appearance: none;
            height: 6px;
            background: #2a2f3a;
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00f0ff;
            cursor: pointer;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .checkbox-item input {
            margin-right: 6px;
        }

        #info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(12, 16, 26, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            font-size: 0.8rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 2px;
        }

        .metric-value {
            font-weight: bold;
            color: #00ffaa;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tourist-bg { background: rgba(0, 240, 255, 0.2); color: #00f0ff; border: 1px solid #00f0ff; }
        .worker-bg { background: rgba(255, 120, 0, 0.2); color: #ff7800; border: 1px solid #ff7800; }
        .resident-bg { background: rgba(0, 255, 120, 0.2); color: #00ff78; border: 1px solid #00ff78; }
        .surveillance-bg { background: rgba(200, 0, 255, 0.2); color: #c800ff; border: 1px solid #c800ff; }
    </style>
    <!-- Three.js and OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>Galeries Lafayette</h1>
        <p style="font-size: 0.75rem; color: #8a99ad; margin-top: -6px;">Psychogeographical Drift & Decompression</p>

        <div class="control-group">
            <label for="projection-select">Decompression Space</label>
            <select id="projection-select">
                <option value="spatial_3d">3D Physical Architecture</option>
                <option value="mds_3d">MDS Multidimensional Scaling</option>
                <option value="pca_3d">PCA Principal Components</option>
                <option value="thermal_3d">Microclimate / Thermal Field</option>
                <option value="commercial_3d">Capital vs Symbolic Field</option>
            </select>
        </div>

        <h2>Non-linear Local Warping</h2>
        <div class="control-group">
            <label>Gamma Warping Factor <span id="val-gamma">1.00</span></label>
            <input type="range" id="slider-gamma" min="0.2" max="3.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label>Spatial Curvature <span id="val-curvature">0.00</span></label>
            <input type="range" id="slider-curvature" min="-0.05" max="0.05" step="0.005" value="0.0">
        </div>
        <div class="control-group">
            <label>Vertical Stretch <span id="val-stretch">1.00</span></label>
            <input type="range" id="slider-stretch" min="0.5" max="2.5" step="0.1" value="1.0">
        </div>

        <h2>Trajectories</h2>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="chk-tourist" checked><span style="color:#00f0ff">Tourist</span></label>
            <label class="checkbox-item"><input type="checkbox" id="chk-worker" checked><span style="color:#ff7800">Worker</span></label>
            <label class="checkbox-item"><input type="checkbox" id="chk-resident" checked><span style="color:#00ff78">Resident</span></label>
            <label class="checkbox-item"><input type="checkbox" id="chk-surveillance" checked><span style="color:#c800ff">Surveillance</span></label>
        </div>
    </div>

    <div id="info-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong id="node-name">Hover / Select Node</strong>
            <span id="node-archetype" class="badge tourist-bg">Info</span>
        </div>
        <div class="metric-row"><span>Temperature (T):</span><span class="metric-value" id="m-temp">-- °C</span></div>
        <div class="metric-row"><span>Humidity (RH):</span><span class="metric-value" id="m-humidity">-- %</span></div>
        <div class="metric-row"><span>Commerce Index:</span><span class="metric-value" id="m-commerce">--</span></div>
        <div class="metric-row"><span>Symbolic Value:</span><span class="metric-value" id="m-symbolic">--</span></div>
        <div class="metric-row"><span>Thermal Stress:</span><span class="metric-value" id="m-stress">--</span></div>
        <div class="metric-row"><span>Flow Density:</span><span class="metric-value" id="m-flow">--</span></div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let dataset = [];
        let trajectoryLines = {};
        let trajectoryPoints = {};
        let architectureGroup;
        let animatedParticles = [];

        const colors = {
            Tourist: 0x00f0ff,
            Worker: 0xff7800,
            Resident: 0x00ff78,
            Surveillance: 0xc800ff
        };

        let currentProjection = 'spatial_3d';
        let gammaWarp = 1.0;
        let curvature = 0.0;
        let verticalStretch = 1.0;

        init();
        loadData();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(40, 40, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff00ff, 0.5, 100);
            pointLight.position.set(-30, 20, -30);
            scene.add(pointLight);

            // Architectural representation of Galeries Lafayette
            buildArchitecture();

            // Setup listeners
            setupUIListeners();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function buildArchitecture() {
            architectureGroup = new THREE.Group();

            // Floor levels (Underground, Ground, VIP, Coupole, Glasswalk, Rooftop)
            const levels = [
                { y: -10, name: 'Underground Metro', r: 25 },
                { y: 0, name: 'Boulevard Ground', r: 30 },
                { y: 20, name: 'VIP Salons', r: 22 },
                { y: 40, name: 'Coupole Dome Base', r: 20 },
                { y: 50, name: 'Glasswalk Runway', r: 18 },
                { y: 70, name: 'Rooftop Terrace', r: 28 }
            ];

            levels.forEach(lvl => {
                const geometry = new THREE.RingGeometry(lvl.r - 2, lvl.r, 32);
                const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.15, wireframe: true });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.rotation.x = Math.PI / 2;
                mesh.position.y = lvl.y;
                architectureGroup.add(mesh);
            });

            // Coupole Glass Dome wireframe model
            const domeGeo = new THREE.SphereGeometry(15, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
            const domeMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true, transparent: true, opacity: 0.2 });
            const domeMesh = new THREE.Mesh(domeGeo, domeMat);
            domeMesh.position.set(0, 40, 0);
            architectureGroup.add(domeMesh);

            scene.add(architectureGroup);
        }

        function transformPosition(pos) {
            let x = pos.x;
            let y = pos.y * verticalStretch;
            let z = pos.z;

            // Apply non-linear local gamma warping
            const r = Math.sqrt(x * x + z * z);
            if (r > 0.001) {
                const rWarped = Math.pow(r, gammaWarp);
                const factor = rWarped / r;
                x *= factor;
                z *= factor;
            }

            // Apply spatial curvature
            y += curvature * (x * x + z * z);

            return new THREE.Vector3(x, y, z);
        }

        function loadData() {
            fetch('decompressed_data.json')
                .then(res => res.json())
                .then(data => {
                    dataset = data;
                    renderTrajectories();
                })
                .catch(err => {
                    console.warn("Could not load decompressed_data.json directly, fallback generated data initialized.", err);
                });
        }

        function renderTrajectories() {
            // Clear existing lines & points
            Object.values(trajectoryLines).forEach(line => scene.remove(line));
            Object.values(trajectoryPoints).forEach(group => scene.remove(group));
            trajectoryLines = {};
            trajectoryPoints = {};

            const archetypes = ['Tourist', 'Worker', 'Resident', 'Surveillance'];

            archetypes.forEach(arch => {
                const items = dataset.filter(d => d.archetype === arch);
                if (items.length === 0) return;

                const points = items.map(d => transformPosition(d[currentProjection]));
                const curve = new THREE.CatmullRomCurve3(points);
                const geometry = new THREE.TubeGeometry(curve, 64, 0.6, 8, false);
                const material = new THREE.MeshStandardMaterial({
                    color: colors[arch] || 0xffffff,
                    emissive: colors[arch] || 0xffffff,
                    emissiveIntensity: 0.5,
                    roughness: 0.2,
                    metalness: 0.8
                });

                const lineMesh = new THREE.Mesh(geometry, material);
                scene.add(lineMesh);
                trajectoryLines[arch] = lineMesh;

                // Points group
                const pointGroup = new THREE.Group();
                items.forEach((d, idx) => {
                    const pos = points[idx];
                    const pGeo = new THREE.SphereGeometry(1.2, 16, 16);
                    const pMat = new THREE.MeshBasicMaterial({ color: colors[arch] || 0xffffff });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.copy(pos);
                    pMesh.userData = d;
                    pointGroup.add(pMesh);
                });
                scene.add(pointGroup);
                trajectoryPoints[arch] = pointGroup;
            });

            updateVisibility();
        }

        function updatePositions() {
            const archetypes = ['Tourist', 'Worker', 'Resident', 'Surveillance'];

            archetypes.forEach(arch => {
                const items = dataset.filter(d => d.archetype === arch);
                if (items.length === 0) return;

                const points = items.map(d => transformPosition(d[currentProjection]));

                // Update tube mesh
                if (trajectoryLines[arch]) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    trajectoryLines[arch].geometry.dispose();
                    trajectoryLines[arch].geometry = new THREE.TubeGeometry(curve, 64, 0.6, 8, false);
                }

                // Update point markers
                if (trajectoryPoints[arch]) {
                    trajectoryPoints[arch].children.forEach((pMesh, idx) => {
                        if (points[idx]) pMesh.position.copy(points[idx]);
                    });
                }
            });

            // Toggle architecture visibility depending on projection
            if (architectureGroup) {
                architectureGroup.visible = (currentProjection === 'spatial_3d');
            }
        }

        function setupUIListeners() {
            document.getElementById('projection-select').addEventListener('change', (e) => {
                currentProjection = e.target.value;
                updatePositions();
            });

            document.getElementById('slider-gamma').addEventListener('input', (e) => {
                gammaWarp = parseFloat(e.target.value);
                document.getElementById('val-gamma').innerText = gammaWarp.toFixed(2);
                updatePositions();
            });

            document.getElementById('slider-curvature').addEventListener('input', (e) => {
                curvature = parseFloat(e.target.value);
                document.getElementById('val-curvature').innerText = curvature.toFixed(3);
                updatePositions();
            });

            document.getElementById('slider-stretch').addEventListener('input', (e) => {
                verticalStretch = parseFloat(e.target.value);
                document.getElementById('val-stretch').innerText = verticalStretch.toFixed(2);
                updatePositions();
            });

            ['tourist', 'worker', 'resident', 'surveillance'].forEach(arch => {
                document.getElementById(`chk-${arch}`).addEventListener('change', updateVisibility);
            });

            // Raycaster for interactive node info display
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const meshes = [];
                Object.values(trajectoryPoints).forEach(group => {
                    if (group.visible) meshes.push(...group.children);
                });

                const intersects = raycaster.intersectObjects(meshes);
                if (intersects.length > 0) {
                    const d = intersects[0].object.userData;
                    if (d) displayNodeInfo(d);
                }
            });
        }

        function displayNodeInfo(d) {
            document.getElementById('node-name').innerText = d.name || d.id;
            const badge = document.getElementById('node-archetype');
            badge.innerText = d.archetype;
            badge.className = `badge ${d.archetype.toLowerCase()}-bg`;

            if (d.raw_dim) {
                document.getElementById('m-temp').innerText = `${d.raw_dim.temperature.toFixed(1)} °C`;
                document.getElementById('m-humidity').innerText = `${(d.raw_dim.humidity * 100).toFixed(0)} %`;
                document.getElementById('m-commerce').innerText = d.raw_dim.commercialVal.toFixed(2);
                document.getElementById('m-symbolic').innerText = d.raw_dim.symbolicVal.toFixed(2);
                document.getElementById('m-stress').innerText = d.raw_dim.thermalStress.toFixed(2);
                document.getElementById('m-flow').innerText = d.raw_dim.flowDensity.toFixed(2);
            }
        }

        function updateVisibility() {
            const vis = {
                Tourist: document.getElementById('chk-tourist').checked,
                Worker: document.getElementById('chk-worker').checked,
                Resident: document.getElementById('chk-resident').checked,
                Surveillance: document.getElementById('chk-surveillance').checked
            };

            Object.keys(vis).forEach(arch => {
                if (trajectoryLines[arch]) trajectoryLines[arch].visible = vis[arch];
                if (trajectoryPoints[arch]) trajectoryPoints[arch].visible = vis[arch];
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Rotate architecture slowly
            if (architectureGroup && currentProjection === 'spatial_3d') {
                architectureGroup.rotation.y += 0.001;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
